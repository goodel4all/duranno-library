const listScreen=document.getElementById('screenList'),detailScreen=document.getElementById('screenDetail'),siteList=document.getElementById('siteList'),markers=document.getElementById('markers'),detailRoot=document.getElementById('detailRoot'),searchInput=document.getElementById('searchInput'),regionFilter=document.getElementById('regionFilter'),topBtn=document.getElementById('topBtn');
function esc(value){return String(value||'').replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch];});}function arr(v){return Array.isArray(v)?v:[];}function color(site){return COLORS[site.regionGroup]||'#8a5d98';}
function showList(){detailScreen.classList.remove('active');listScreen.classList.add('active');history.replaceState(null,'','#');setTimeout(function(){window.scrollTo({top:0,behavior:'smooth'});},0);}function openSite(id){const site=SITES.find(function(item){return item.id===id;});if(!site)return;listScreen.classList.remove('active');detailScreen.classList.add('active');history.replaceState(null,'','#place-'+id);detailRoot.innerHTML=renderDetail(site);window.scrollTo({top:0,behavior:'smooth'});}function renderDetail(site){const verses=arr(site.bible_verses).map(function(v){return '<li>'+esc(v)+'</li>';}).join('');const points=arr(site.main_points).map(function(p){return '<li>'+esc(p)+'</li>';}).join('');const nav='<div class="navRow"><button class="navBtn" type="button" onclick="showList()">목차로</button><a class="mapBtn" href="'+esc(site.googleUrl)+'" target="_blank" rel="noopener">Google 지도로</a></div>';return '<header class="detailHead"><div class="kicker">'+String(site.id).padStart(2,'0')+' · '+esc(site.region)+' · '+esc(site.regionGroup)+'</div><h1 class="detailTitle">'+esc(site.name)+'</h1><p class="detailDesc">'+esc(site.description)+'</p>'+nav+'</header><main class="content"><section class="section"><h2>해설서</h2><div class="detailsText">'+esc(site.details)+'</div></section><section class="section"><h2>성경 본문</h2><ul class="verseList">'+verses+'</ul></section><section class="section"><h2>묵상 포인트</h2><ul class="pointList">'+points+'</ul></section></main><div class="footNav">'+nav+'</div>';}
function visibleSites(){const q=searchInput.value.trim().toLowerCase(),r=regionFilter.value;return SITES.filter(function(site){const matchesRegion=!r||site.regionGroup===r;const hay=[site.name,site.region,site.regionGroup,site.details].join(' ').toLowerCase();return matchesRegion&&(!q||hay.includes(q));});}
function render(){const items=visibleSites();markers.innerHTML=items.map(function(site){return '<button class="marker" style="--x:'+site.mapPoint.x+';--y:'+site.mapPoint.y+';--c:'+color(site)+'" type="button" aria-label="'+esc(site.id+'번 '+site.name)+'" onclick="openSite('+site.id+')">'+site.id+'</button>';}).join('');siteList.innerHTML=items.length?items.map(function(site){return '<button class="siteCard" style="--c:'+color(site)+'" type="button" onclick="openSite('+site.id+')"><span class="num">'+site.id+'</span><span><span class="siteName">'+esc(site.name)+'</span><span class="siteMeta">'+esc(site.region)+' · '+esc(site.regionGroup)+'</span></span></button>';}).join(''):'<div class="empty">검색 결과가 없습니다.</div>';}
searchInput.addEventListener('input',render);regionFilter.addEventListener('change',render);topBtn.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});window.addEventListener('hashchange',function(){const id=Number(location.hash.replace('#place-',''));if(id)openSite(id);else showList();});render();const initialId=Number(location.hash.replace('#place-',''));if(initialId)openSite(initialId);
</script></body></html>
