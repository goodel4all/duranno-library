    function cleanTitle(filename) {
      return filename
        .replace(/\.html$/, '')
        .replace(/^\[도서인사이트\]_/, '')
        .replace(/^\[신앙적 책 읽기\]_/, '')
        .replace(/^신앙적 책읽기\s*['"]?/, '')
        .replace(/['"]$/, '');
    }
  
    

    const grid = document.getElementById('bookGrid');
    const searchInput = document.getElementById('searchInput');
    const emptyState = document.getElementById('emptyState');
    const statusBar = document.getElementById('statusBar');

    rawFiles.forEach(file => {
      const displayTitle = cleanTitle(file);
      const card = document.createElement('a');
      card.className = 'book-card';
      card.href = 'books/' + encodeURI(file);
      card.dataset.title = displayTitle.toLowerCase();
      card.dataset.raw = file.toLowerCase();

      card.innerHTML = `
        <div class="cover-banner">
          <span>신앙적 책 읽기</span>
        </div>
        <div class="card-body">
          <h2 class="book-title">${displayTitle}</h2>
          <span class="badge-audio">🎧 오디오 본문 포함</span>
        </div>
      `;
      grid.appendChild(card);
    });

    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      const allCards = document.querySelectorAll('.book-card');
      let visibleCount = 0;

      allCards.forEach(card => {
        const title = card.dataset.title;
        const raw = card.dataset.raw;
        if (title.includes(query) || raw.includes(query)) {
          card.style.display = 'flex';
          visibleCount++;
        } else {
          card.style.display = 'none';
        }
      });

      emptyState.style.display = visibleCount === 0 ? 'block' : 'none';
      statusBar.textContent = query ? `검색 결과 ${visibleCount}권` : `등록된 책 총 ${allCards.length}권`;
    });
