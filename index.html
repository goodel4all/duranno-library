<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신앙적 책 읽기 | 온라인 서재</title>
  
  <!-- Open Graph: 카카오톡/SNS 공유 카드 최적화 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="신앙적 책 읽기 서재">
  <meta property="og:description" content="언제든 편안하게 읽고 듣는 100여 편의 신앙 독서 나눔">
  <meta property="og:image" content="https://raw.githubusercontent.com/username/repo-name/main/assets/og-cover.jpg">
  <meta name="theme-color" content="#2e4d41">

  <!-- Font: Pretendard -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

  <style>
    :root {
      --primary: #2e4d41;
      --primary-light: #446859;
      --bg-base: #f7f9f8;
      --surface: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-subtle: #e5e7eb;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* 상단 헤더 & 검색 배너 */
    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #ffffff;
      padding: 3rem 1.25rem 2.5rem;
      text-align: center;
    }
    .header-content {
      max-width: 680px;
      margin: 0 auto;
    }
    header h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    header p {
      font-size: 0.95rem;
      opacity: 0.9;
      margin-bottom: 1.75rem;
    }

    /* 실시간 검색창 */
    .search-box {
      position: relative;
      width: 100%;
    }
    .search-box input {
      width: 100%;
      padding: 0.9rem 1.25rem;
      font-size: 1rem;
      border-radius: 9999px;
      border: none;
      outline: none;
      background: #ffffff;
      color: var(--text-main);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      transition: box-shadow 0.2s ease;
    }
    .search-box input:focus {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    /* 본문 도서 그리드 */
    main {
      max-width: 1120px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .status-bar {
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    /* 개별 책 카드 */
    .book-card {
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .book-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }
    .cover-wrap {
      width: 100%;
      height: 180px;
      background: #e2e8f0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cover-fallback {
      font-size: 1.1rem;
      font-weight: 600;
      color: #64748b;
      padding: 1rem;
      text-align: center;
    }
    .card-body {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .book-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .book-excerpt {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      flex-grow: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .badge-audio {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--primary);
      background-color: #e9f2ee;
      padding: 0.25rem 0.55rem;
      border-radius: 6px;
      align-self: flex-start;
    }

    /* 검색 결과 없음 */
    .empty-state {
      display: none;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <h1>신앙적 책 읽기</h1>
      <p>말씀과 신앙 문헌을 언제 어디서나 읽고 듣는 온라인 서재</p>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="책 제목, 저자, 키워드를 입력하세요...">
      </div>
    </div>
  </header>

  <main>
    <div class="status-bar" id="statusBar">등록된 책 총 3권</div>
    <div class="book-grid" id="bookGrid">

      <!-- 책 카드 템플릿: 데이터가 늘어나면 아래 블록을 복제/추가합니다 -->
      <a href="books/book_001.html" class="book-card" data-title="순전한 기독교" data-keyword="C.S.루이스 변증 신앙">
        <div class="cover-wrap">
          <img src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400&q=80" alt="표지 이미지">
        </div>
        <div class="card-body">
          <h2 class="book-title">순전한 기독교</h2>
          <p class="book-excerpt">모든 그리스도인이 공통으로 믿어 온 핵심 진리와 이성적 믿음에 관한 변증적 고찰.</p>
          <span class="badge-audio">🎧 오디오 포함</span>
        </div>
      </a>

      <a href="books/book_002.html" class="book-card" data-title="그리스도를 본받아" data-keyword="토마스 아 켐피스 영성 기도 묵상">
        <div class="cover-wrap">
          <div class="cover-fallback">그리스도를 본받아</div>
        </div>
        <div class="card-body">
          <h2 class="book-title">그리스도를 본받아</h2>
          <p class="book-excerpt">세상 헛된 영광을 버리고 내면의 참된 평화와 그리스도의 발자취를 따르는 묵상집.</p>
          <span class="badge-audio">🎧 오디오 포함</span>
        </div>
      </a>

      <a href="books/book_003.html" class="book-card" data-title="천로역정" data-keyword="존 번연 우화 구원 순례">
        <div class="cover-wrap">
          <div class="cover-fallback">천로역정</div>
        </div>
        <div class="card-body">
          <h2 class="book-title">천로역정</h2>
          <p class="book-excerpt">멸망의 도시를 떠나 하늘 성을 향해 나아가는 순례자의 고난과 은혜의 여정.</p>
          <span class="badge-audio">🎧 오디오 포함</span>
        </div>
      </a>

      <div class="empty-state" id="emptyState">
        검색 결과와 일치하는 도서가 없습니다.
      </div>
    </div>
  </main>

  <script>
    const searchInput = document.getElementById('searchInput');
    const cards = document.querySelectorAll('.book-card');
    const emptyState = document.getElementById('emptyState');
    const statusBar = document.getElementById('statusBar');

    statusBar.textContent = `등록된 책 총 ${cards.length}권`;

    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase().trim();
      let matchCount = 0;

      cards.forEach(card => {
        const title = card.getAttribute('data-title').toLowerCase();
        const keywords = card.getAttribute('data-keyword').toLowerCase();
        const excerpt = card.querySelector('.book-excerpt').textContent.toLowerCase();

        if (title.includes(term) || keywords.includes(term) || excerpt.includes(term)) {
          card.style.display = 'flex';
          matchCount++;
        } else {
          card.style.display = 'none';
        }
      });

      emptyState.style.display = matchCount === 0 ? 'block' : 'none';
      statusBar.textContent = term ? `검색 결과 ${matchCount}권` : `등록된 책 총 ${cards.length}권`;
    });
  </script>
</body>
</html>
